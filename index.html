<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me Rahi? ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');

        body {
            background-color: #ffeef2;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            touch-action: none;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            z-index: 10;
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ff4d6d;
            margin-bottom: 1rem;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 1.5rem;
            min-height: 100px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            border: none;
            outline: none;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            z-index: 20;
        }

        #noBtn {
            background-color: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            position: absolute;
            transition: all 0.2s ease;
            z-index: 15;
        }

        .floating-emoji {
            position: fixed;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 1;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        #celebration-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #fffafa;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .blast-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            color: #ff4d6d;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Music Uploader Styling */
        .music-control {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 50;
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rahi-photo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ff4d6d;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Player -->
    <audio id="bgMusic" loop></audio>

    <!-- Music Uploader -->
    <div class="music-control">
        <label for="musicUpload" class="cursor-pointer font-bold text-pink-500">🎵 CHOOSE SONG</label>
        <input type="file" id="musicUpload" accept="audio/*" class="hidden" onchange="loadMusic(event)">
        <span id="musicStatus" class="text-gray-400">No song selected</span>
    </div>

    <div class="container" id="main-box">
        <!-- Rahi's Photo -->
        <img src="https://api.screenshotmachine.com/?key=1e9673&url=https%3A%2F%2Fstorage.googleapis.com%2Fstatic.invideo.io%2Fpropose_site_photo.png&dimension=1024x1024" 
             onerror="this.src='https://ui-avatars.com/api/?name=Rahi&background=FF4D6D&color=fff&size=200'" 
             alt="Rahi" class="rahi-photo">
        
        <h1>Hey Rahi, <br>Do you love me? ❤️</h1>
        
        <div class="btn-container" id="btnWrapper">
            <button id="yesBtn" class="btn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" class="btn" onmouseover="handleNoInteraction()" onclick="handleNoInteraction()">No...</button>
        </div>
    </div>

    <!-- Celebration Screen -->
    <div id="celebration-overlay">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG54ZnpueG54ZnpueG54ZnpueG54ZnpueG54ZnpueG54ZnpueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/iCVz2SSs1L9RYatXUX/giphy.gif" alt="Happy Teddy" class="w-56 mb-4">
        <h1 class="blast-text">I Love You Too, Rahi! ❤️😘</h1>
        <p class="text-pink-400 font-bold mt-4 animate-bounce">Life is incomplete without you! ✨</p>
    </div>

    <script>
        let musicStarted = false;
        const music = document.getElementById('bgMusic');

        // Function to load and play user's music
        function loadMusic(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                music.src = url;
                music.play();
                document.getElementById('musicStatus').innerText = "Playing: " + file.name.substring(0, 15) + "...";
                musicStarted = true;
            }
        }

        // Floating Background Elements
        function spawnEmoji() {
            const emojis = ['❤️', '🧸', '💖', '🧸', '💋', '✨', '🌸'];
            const emoji = document.createElement('div');
            emoji.classList.add('floating-emoji');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 5000);
        }
        setInterval(spawnEmoji, 400);

        window.onload = () => {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            noBtn.style.left = (yesBtn.offsetLeft + yesBtn.offsetWidth + 20) + 'px';
            noBtn.style.top = yesBtn.offsetTop + 'px';
        };

        function handleNoInteraction() {
            moveNoButton();
        }

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const padding = 50;
            const newX = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding);
            const newY = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';

            const phrases = [
                "No?", 
                "Think again!", 
                "Please Rahi!", 
                "Wrong button!", 
                "Try Again! 😜", 
                "You can't catch me!",
                "Say YES! ❤️"
            ];
            noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            
            const yesBtn = document.getElementById('yesBtn');
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            if (currentSize < 60) {
                yesBtn.style.fontSize = (currentSize + 3) + 'px';
                yesBtn.style.padding = "18px 55px";
            }
        }

        function celebrate() {
            document.getElementById('celebration-overlay').style.display = 'flex';
            
            // Confetti Blast
            const end = Date.now() + (12 * 1000);
            const colors = ['#ff4d6d', '#ff758f', '#c9184a', '#ffffff'];

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });
                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            // Kiss emojis spray
            for(let i=0; i<20; i++) {
                setTimeout(() => {
                    const k = document.createElement('div');
                    k.innerText = '💋';
                    k.style.position = 'fixed';
                    k.style.left = Math.random() * 100 + 'vw';
                    k.style.top = Math.random() * 100 + 'vh';
                    k.style.fontSize = '3.5rem';
                    k.style.zIndex = '150';
                    k.classList.add('animate-bounce');
                    document.body.appendChild(k);
                    setTimeout(() => k.remove(), 2500);
                }, i * 300);
            }
        }
    </script>
</body>
</html>
